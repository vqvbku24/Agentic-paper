[project]
name = "dseek"
version = "0.1.0"
description = "Disguise-and-Seek Pilot"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
dseek = "dseek.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dseek"]
